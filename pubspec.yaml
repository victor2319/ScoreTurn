name: autoscore
description: Offline-first piano sheet music page turner (experimental MVP)
publish_to: none
version: 0.3.0+3

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0
  record: ^7.1.2
  pdfx: ^2.11.0
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/page_88.jpg
    - assets/demo/page_89.jpg
